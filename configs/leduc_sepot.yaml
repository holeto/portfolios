# Leduc with the depth limit at the public card, matching the tabular validation:
# the first betting round and the rest of the game after the public card are solved
# separately. The portfolio of each player (blueprint + 11 transformations) has 12
# options, the amount of pure strategies of a player in a post-public subgame.
game:
  name: leduc
  params: {}

train:
  steps: 30000
  seed: 42
  num_transformations: 11
  value_type: matrix_valued
  # Trained before the value network ratios were clipped by default (mvs_rho_vtrace: 1.0),
  # pinned so that the config keeps matching the saved model.
  mvs_rho_vtrace: null
  # The default at the time of the first run (now 1000), pinned so that the
  # config keeps matching the saved model.
  entropy_schedule_size: [20000]
  # All other RNaD hyperparameters are the defaults of RNaDConfig.

checkpoint:
  save: sepot
  save_every: 1000
  print_every: 1000
  eval_every: 1000
  resume: false

eval:
  search:
    depth_limit: null
    leaf_after_chances: 2
    resolve_iterations: 1000
    resolve_every_step: false
    prune_threshold: 1.0e-10
  tests:
    blueprint_exploitability: {}
    search_exploitability:
      leaf_values: mvs
