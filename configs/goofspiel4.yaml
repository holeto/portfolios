game:
  name: goofspiel
  params:
    cards: 4

train:
  steps: 20000
  seed: 42
  batch_size: 128
  learning_rate: 3.0e-4
  actor_network_layers: [128, 128]
  critic_network_layers: [128, 128]
  mvs_network_layers: [128, 128]
  transformation_network_layers: [128, 128]
  num_transformations: 3
  entropy_schedule_size: [1000]
  entropy_schedule_repeats: [1]
  eta_reward_transform: 0.2

checkpoint:
  save: sepot
  save_every: 5000
  print_every: 1000
  eval_every: 5000
  resume: false

eval:
  search:
    depth_limit: 1
    resolve_iterations: 1000
    resolve_every_step: false
    prune_threshold: 1.0e-10
  tests:
    blueprint_exploitability: {}
    search_exploitability:
      leaf_values: mvs
