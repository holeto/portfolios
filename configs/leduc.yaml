game:
  name: leduc
  params: {}

train:
  steps: 50000
  seed: 42
  batch_size: 256
  learning_rate: 1.0e-4
  actor_network_layers: [256, 256]
  critic_network_layers: [256, 256]
  mvs_network_layers: [256, 256]
  transformation_network_layers: [256, 256]
  num_transformations: 5
  entropy_schedule_size: [2000]
  entropy_schedule_repeats: [1]
  eta_reward_transform: 0.2

checkpoint:
  save: sepot
  save_every: 5000
  print_every: 1000
  eval_every: 10000
  resume: false

eval:
  search:
    depth_limit: 2
    resolve_iterations: 1000
    resolve_every_step: false
    prune_threshold: 1.0e-10
  tests:
    blueprint_exploitability: {}
    search_exploitability:
      leaf_values: mvs
