# Fork of leduc_sepot_mvs.yaml at step 15000 with the importance ratios of the value
# network targets clipped at 2.0 (mvs_rho_vtrace), the blueprint training is unchanged.
#
# Leduc with multi valued states and the depth limit at the public card: the first
# betting round and the rest of the game after the public card are solved separately.
# The portfolio of each player (blueprint + 11 transformations) has 12 options, the
# amount of pure strategies of a player in a post-public subgame.
game:
  name: leduc
  params: {}

train:
  steps: 30000
  seed: 42
  num_transformations: 11
  value_type: multi_valued
  mvs_rho_vtrace: 2.0
  # All other RNaD hyperparameters are the defaults of RNaDConfig.

checkpoint:
  save: sepot
  save_every: 1000
  print_every: 1000
  eval_every: 1000
  resume: false
  fork_from: 15000
  fork_name: mvs_rho_2

eval:
  search:
    depth_limit: null
    leaf_after_chances: 2
    resolve_iterations: 1000
    resolve_every_step: false
    prune_threshold: 1.0e-10
  tests:
    blueprint_exploitability: {}
    search_exploitability:
      leaf_values: mvs
