# Leduc with HullCover portfolios and multi valued states, with the R-NaD hyperparameters of the
# SePoT paper as in leduc_paper_params.yaml (the transformation network is not used by HullCover).
# Pools of up to 30 strategies (cap_c), from which the MILP selects portfolios of k = 10 mixtures,
# the size of the SePoT portfolios (10 transformations). The HullCover settings are those of
# leduc_hullcover.yaml.
# leduc_paper_params_hullcover.yaml with seed 134.
game:
  name: leduc
  params: {}

train:
  steps: 75000
  seed: 134
  portfolio_method: hullcover
  value_type: multi_valued
  actor_network_layers: [1024, 1024]
  critic_network_layers: [1024, 1024]
  mvs_network_layers: [1024, 1024]
  batch_size: 64
  learning_rate: 3.0e-4
  adam:
    b1: 0.0
    b2: 0.999
    # 10e-8 = 1e-7, as written in the R-NaD code (the paper states 10^-8).
    eps: 10e-8
  clip_gradient: 10000
  target_network_avg: 0.001
  # The regularisation policy is updated every 500 learner steps 200 times, then every 10000.
  entropy_schedule_size: [500, 10000]
  entropy_schedule_repeats: [200, 1]
  eta_reward_transform: 0.2
  neurd_beta: 2.0
  neurd_clip: 10000
  c_vtrace: 1.0
  rho_vtrace: .inf
  # The value network ratios are not clipped either (rho_vtrace).
  mvs_rho_vtrace: null
  hullcover:
    every: 100
    cap_c: 30
    cap_x: 30
    alphas: [0.25, 0.5, 0.75, 1.0]
    partners: 4
    tol: 1.0e-9
    row_op: mix
    evict_rule: outclassed
    vertex_space: logit
    vertex_window: step
    eval_games: 512
    min_component_weight: 1.0e-3

checkpoint:
  save: paper_params_hullcover
  save_every: 500
  print_every: 500
  eval_every: 500
  resume: false

eval:
  search:
    depth_limit: null
    leaf_after_chances: 2
    resolve_iterations: 800
    resolve_every_step: false
    prune_threshold: 1.0e-10
  hullcover:
    k: 10
    milp_time_limit: 120.0
    milp_gap: 0.01
  tests:
    blueprint_exploitability: {}
    search_exploitability:
      leaf_values: mvs
