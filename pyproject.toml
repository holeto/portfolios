[project]
name = "portfolios"
version = "0.1.0"
description = "Depth-limited solving with RNaD-SePoT portfolios on JAX games"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "chex>=0.1.86",
    "flax>=0.8.5",
    "optax>=0.2.3",
    "numpy>=1.26",
    "pyyaml>=6.0.3",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["games", "iig_algorithms", "train", "gameplay", "evaluation"]

# Installed into .venv in editable mode by `uv sync`, so that the packages are
# importable from any script, e.g. `uv run python evaluation/cfr_validation.py`.
[tool.uv]
package = true
